apiVersion: apps/v1
kind: Deployment
metadata:
  name: compass-backend
  labels:
    app: compass-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compass-backend
  template:
    metadata:
      labels:
        app: compass-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/OWNER/compass-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: compass-config
            - secretRef:
                name: compass-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: vector-store
              mountPath: /app/data/vector_store
      volumes:
        - name: vector-store
          persistentVolumeClaim:
            claimName: compass-vector-store-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: compass-backend
spec:
  selector:
    app: compass-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: compass-vector-store-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
